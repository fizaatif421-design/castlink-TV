<!DOCTYPE html>
<html>
<head>
    <title>CastLink TV</title>

    <style>
        body {
            margin: 0;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .box {
            padding: 50px;
        }

        .logo {
            font-size: 80px;
        }

        h1 {
            font-size: 55px;
            margin: 10px;
        }

        p {
            font-size: 25px;
            color: #bbb;
        }

        #status {
            margin-top: 30px;
            font-size: 22px;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">📺</div>

    <h1>CastLink TV</h1>

    <p>Waiting for CastLink...</p>

    <div id="status">
        🟢 Ready to receive a cast
    </div>

</div>

</body>
</html>
